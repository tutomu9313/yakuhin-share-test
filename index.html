<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PC・iPhone 共有テスト</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}.app{width:min(390px,100%);margin:auto;min-height:100vh;padding-bottom:28px}header{background:#007aff;color:#fff;text-align:center;padding:16px 12px;font-size:20px;font-weight:700}.card{background:#fff;border-radius:14px;padding:16px;margin:12px;box-shadow:0 1px 4px #0001}label{display:block;font-weight:600;margin-bottom:7px}input,button{width:100%;min-height:46px;font-size:17px;border-radius:10px}input{border:1px solid #c7c7cc;padding:10px}button{border:0;background:#007aff;color:#fff;font-weight:700;margin-top:10px}button.gray{background:#8e8e93}.note{font-size:13px;color:#666;line-height:1.5}.status{font-weight:700;line-height:1.5}.item{padding:12px 0;border-bottom:1px solid #ddd}.item:last-child{border-bottom:0}.small{font-size:12px;color:#777}.hidden{display:none}</style></head><body><div class="app"><header>PC・iPhone 共有テスト</header>
<div class="card"><div class="status" id="status">未接続</div><div class="note">本体アプリとは別の最小テスト版です。PCで登録したデータがiPhoneから見えるかを確認します。</div></div>
<div class="card"><label>テストデータ</label><input id="testText" placeholder="例：PCから登録しました"><button id="saveBtn">クラウドに登録</button><button id="reloadBtn" class="gray">クラウドから再読込</button></div>
<div class="card"><label>登録データ</label><div id="list">まだありません。</div></div>
<div class="card"><div class="note">初回設定では Supabase のProject URLとPublishable keyが必要です。<br><b>service_role / secret key は絶対に入力しないでください。</b></div><button id="setupBtn" class="gray">接続設定</button></div>
<div id="setupCard" class="card hidden"><label>Supabase Project URL</label><input id="url" placeholder="https://xxxxxxxx.supabase.co"><label style="margin-top:12px">Publishable key</label><input id="key" placeholder="sb_publishable_..."><button id="connectBtn">接続して保存</button><button id="clearBtn" class="gray">設定を消去</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const CFG_KEY="yakuhin_supabase_test_config";let client=null;function $(id){return document.getElementById(id)}function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}function setStatus(msg,ok=false){$("status").textContent=msg;$("status").style.color=ok?"#34c759":"#ff3b30"}function makeClient(){try{const c=JSON.parse(localStorage.getItem(CFG_KEY)||"null");if(!c?.url||!c?.key){client=null;setStatus("未接続");return false}client=supabase.createClient(c.url,c.key);setStatus("接続設定済み",true);return true}catch(e){client=null;setStatus("接続設定を確認してください");return false}}async function loadRows(){if(!client)return;const {data,error}=await client.from("yakuhin_share_test").select("*").order("created_at",{ascending:false});if(error){setStatus("読込エラー："+error.message);return}const box=$("list");box.innerHTML="";if(!data?.length){box.textContent="まだありません。";return}data.forEach(x=>{const d=document.createElement("div");d.className="item";d.innerHTML="<b>"+esc(x.text)+"</b><div class='small'>"+esc(new Date(x.created_at).toLocaleString("ja-JP"))+"</div>";box.appendChild(d)})}$("saveBtn").onclick=async()=>{if(!client){alert("先に「接続設定」を行ってください。");return}const text=$("testText").value.trim();if(!text){alert("テストデータを入力してください。");return}const {error}=await client.from("yakuhin_share_test").insert({text});if(error){setStatus("登録エラー："+error.message);return}$("testText").value="";setStatus("登録しました",true);await loadRows()};$("reloadBtn").onclick=()=>loadRows();$("setupBtn").onclick=()=>$("setupCard").classList.toggle("hidden");$("connectBtn").onclick=()=>{const url=$("url").value.trim(),key=$("key").value.trim();if(!/^https:\/\/[A-Za-z0-9.-]+\.supabase\.co$/.test(url)){alert("Project URLを確認してください。");return}if(!key){alert("Publishable keyを入力してください。");return}localStorage.setItem(CFG_KEY,JSON.stringify({url,key}));$("setupCard").classList.add("hidden");makeClient();loadRows()};$("clearBtn").onclick=()=>{localStorage.removeItem(CFG_KEY);client=null;$("url").value="";$("key").value="";$("list").textContent="まだありません。";setStatus("未接続")};window.addEventListener("load",()=>{const c=JSON.parse(localStorage.getItem(CFG_KEY)||"null");if(c){$("url").value=c.url||"";$("key").value=c.key||"";makeClient();loadRows()}});
</script></div></body></html>
